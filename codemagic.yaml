workflows:
  ucup-android:
    name: UCUP Android APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create Android project files
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
